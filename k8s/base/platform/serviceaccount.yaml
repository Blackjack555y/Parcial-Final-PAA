# Identidad de los pods. Sin token montado: las apps no hablan con la API de Kubernetes.
# En EKS real llevaría la anotación eks.amazonaws.com/role-arn (IRSA) con permisos mínimos
# sobre las tablas aegisvolt-*-<env>, en vez de credenciales estáticas.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aegisvolt-app
automountServiceAccountToken: false
