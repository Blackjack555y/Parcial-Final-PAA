# Ambiente dev: namespace + plataforma + pista estable + consola web.
#   kubectl kustomize k8s/overlays/dev   (lo aplica scripts/deploy.sh con la etiqueta de imagen)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: aegisvolt-dev
resources:
  - namespace.yaml
  - ../../base/platform
  - apps
  - ../../base/frontend
labels:
  - pairs:
      aegisvolt/environment: dev
    includeTemplates: true
patches:
  - target: { kind: Ingress, name: frontend }
    patch: |-
      - op: replace
        path: /spec/rules/0/host
        value: app.dev.aegisvolt.local
configMapGenerator:
  - name: aegisvolt-config
    literals:
      - AEGIS_ENV=dev
      - AEGIS_CLOUDWATCH_LOGS=true
      - AWS_ENDPOINT_URL=http://floci:4566 # en EKS real: se omite (endpoints de AWS vía VPCE)
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test # solo Floci; en EKS real: IRSA, sin credenciales estáticas
      - AWS_SECRET_ACCESS_KEY=test
      - PEAK_HOURS=0-24
      - PRICING_TZ=America/Bogota
      - LOG_LEVEL=INFO
      - CHARGING_SIMULATION_SPEEDUP=20 # carga simulada acelerada (demo); prod = tiempo real
      - CORS_ORIGINS=http://app.dev.aegisvolt.local,http://127.0.0.1:3001,http://localhost:3001,http://localhost:5173
generatorOptions:
  disableNameSuffixHash: true # la pista canary referencia el mismo ConfigMap por nombre
