# Checks obligatorios de todo PR hacia dev, test o prod.
# Los nombres de los jobs (name:) DEBEN coincidir con .github/rulesets/protected-branches.json;
# si no coinciden, el ruleset espera un check que nunca llega y el merge queda bloqueado.
name: pr-checks

on:
  pull_request:
    branches: [dev, test, prod]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  lint-build:
    name: lint-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + formato)
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: Docker Compose válido
        run: docker compose config --quiet
      # Fase 3: aquí se agrega el build de las imágenes y la validación del esquema GraphQL.

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
    services:
      floci: # Floci efímero (modo memoria): no necesita el estado persistente
        image: floci/floci:2.4.0
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Esperar a Floci
        run: |
          for _ in $(seq 30); do
            curl -fs "$AWS_ENDPOINT_URL/_floci/health" >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Floci no respondió en 60 s"; exit 1
      - run: pytest tests/integration

  e2e-tests:
    name: e2e-tests
    runs-on: ubuntu-latest
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Levantar el stack (Fase 0 = Floci; Fase 3 = stack completo)
        run: docker compose up -d --wait
      - run: pytest tests/e2e
      - name: Logs del stack si falla
        if: failure()
        run: docker compose logs --no-color
      - name: Bajar el stack
        if: always()
        run: docker compose down -v

  terraform-plan:
    name: terraform-plan
    # Fase 0: fmt + validate en runner de GitHub (aún no hay estado).
    # Fase 1: pasa al runner self-hosted y ejecuta plan contra el workspace de la rama destino (T1).
    runs-on: ubuntu-latest
    env:
      TARGET_ENV: ${{ github.base_ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff
      - name: Workspace destino
        run: echo "PR hacia '${TARGET_ENV}' → workspace Terraform '${TARGET_ENV}'" >> "$GITHUB_STEP_SUMMARY"
