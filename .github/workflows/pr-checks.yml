# Checks obligatorios de todo PR hacia dev, test o prod.
# Los nombres de los jobs (name:) DEBEN coincidir con .github/rulesets/protected-branches.json;
# si no coinciden, el ruleset espera un check que nunca llega y el merge queda bloqueado.
name: pr-checks

on:
  pull_request:
    branches: [dev, test, prod]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_DEFAULT_REGION: us-east-1

jobs:
  lint-build:
    name: lint-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Ruff (lint + formato)
        run: |
          ruff check --output-format=github .
          ruff format --check .
      - name: ShellCheck
        run: shellcheck scripts/*.sh
      - name: actionlint (workflows)
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.12 -color
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend (typecheck + build + pruebas)
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
          npm test
      - name: Esquema GraphQL al día (schema.graphql = código)
        run: python scripts/export_schema.py --check
      - name: Manifiestos de Kubernetes (los 9 overlays renderizan)
        run: |
          for env in dev test prod; do
            for o in "k8s/overlays/$env" "k8s/overlays/$env/canary"; do
              kubectl kustomize "$o" > /dev/null && echo "✓ $o"
            done
          done
      - name: Docker Compose válido
        run: |
          docker compose -f compose.yaml -f compose.apps.yaml config --quiet
          docker network create minikube >/dev/null  # red externa que en local crea minikube
          docker compose -f compose.yaml -f compose.observability.yaml config --quiet
      - name: Build de las 4 imágenes
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker compose -f compose.yaml -f compose.apps.yaml build --pull
          docker build --pull -f observability/prefect/Dockerfile -t "aegisvolt/prefect-flows:$IMAGE_TAG" .
      - name: Trivy (sin vulnerabilidades HIGH/CRITICAL con parche disponible)
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          for svc in station-reservation-service billing-wallet-service energy-dispatch-service graphql-gateway frontend prefect-flows; do
            echo "::group::Trivy $svc"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:0.76.2 image --quiet --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 "aegisvolt/$svc:$IMAGE_TAG"
            echo "::endgroup::"
          done

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/unit

  integration-tests:
    name: integration-tests
    runs-on: ubuntu-latest
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
    services:
      floci: # Floci efímero (modo memoria): no necesita el estado persistente
        image: floci/floci:2.4.0
        ports: ["4566:4566"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Esperar a Floci
        run: |
          for _ in $(seq 30); do
            curl -fs "$AWS_ENDPOINT_URL/_floci/health" >/dev/null && exit 0
            sleep 2
          done
          echo "::error::Floci no respondió en 60 s"; exit 1
      - run: pytest tests/integration

  e2e-tests:
    name: e2e-tests
    # Ambiente efímero completo en el runner: Floci + infraestructura creada con el MISMO
    # Terraform (workspace dev, estado local desechable) + datos de demo + 4 contenedores.
    runs-on: ubuntu-latest
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AEGIS_ENV: dev
      E2E_ENV: dev
      GATEWAY_URL: http://127.0.0.1:8000
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - run: pip install -r requirements-dev.txt
      - name: Token admin efímero
        run: echo "FLAGS_ADMIN_TOKEN=$(python -c 'import secrets; print(secrets.token_urlsafe(24))')" >> "$GITHUB_ENV"
      - name: Floci
        run: docker compose up -d --wait floci
      - name: Infraestructura con Terraform (workspace dev, estado local efímero)
        working-directory: infra/envs
        run: |
          printf 'terraform {\n  backend "local" {}\n}\n' > backend_override.tf
          terraform init -input=false
          terraform workspace select -or-create=true dev
          terraform apply -input=false -auto-approve -var-file=floci.tfvars -no-color | tail -3
      - name: Datos de demostración
        run: python scripts/seed.py dev
      - name: Stack de servicios (contenedores)
        run: docker compose -f compose.yaml -f compose.apps.yaml up -d --build --wait
      - name: Pruebas e2e (HTTP + WSS + CloudWatch)
        run: pytest tests/e2e -v
      - name: Logs del stack si falla
        if: failure()
        run: docker compose -f compose.yaml -f compose.apps.yaml logs --no-color --tail 200
      - name: Bajar el stack
        if: always()
        run: docker compose -f compose.yaml -f compose.apps.yaml down -v

  terraform-plan:
    name: terraform-plan
    # T1: corre en el runner self-hosted porque necesita el tfstate REAL del ambiente destino
    # (vive en el S3 de Floci de esta máquina). Un plan contra un Floci vacío no validaría nada.
    # T3: los PR desde forks nunca llegan al runner self-hosted; corren en GitHub y fallan.
    runs-on: ${{ github.event.pull_request.head.repo.full_name == github.repository && fromJSON('["self-hosted","aegisvolt"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write # publicar el plan como comentario del PR
    concurrency:
      group: terraform-${{ github.base_ref }} # un plan a la vez por workspace
      cancel-in-progress: false
    env:
      TARGET_ENV: ${{ github.base_ref }} # la rama destino ES el workspace
      SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Rechazar PR de forks
        if: env.SAME_REPO != 'true'
        run: |
          echo "::error::Los PR desde forks no pueden ejecutar terraform plan sobre el estado real."
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false # el wrapper ensucia la salida de `terraform show -json`
      - name: terraform fmt
        run: terraform fmt -check -recursive -diff infra
      - name: Floci disponible
        run: curl -fs http://localhost:4566/_floci/health >/dev/null
      - name: terraform plan (workspace = rama destino)
        run: |
          export TF_PLUGIN_CACHE_DIR="$HOME/.terraform.d/plugin-cache"
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          ./scripts/tf.sh "$TARGET_ENV" plan -out="$RUNNER_TEMP/tfplan" -no-color | tee "$RUNNER_TEMP/plan.txt"
          (cd infra/envs && terraform show -json "$RUNNER_TEMP/tfplan") > "$RUNNER_TEMP/plan.json"
      - name: Guardia de aislamiento entre ambientes
        run: python3 scripts/check_plan_env.py "$TARGET_ENV" "$RUNNER_TEMP/plan.json" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publicar el plan en el PR
        if: always() && env.SAME_REPO == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          marker="<!-- terraform-plan:${TARGET_ENV} -->"
          summary=$(grep -E '^(Plan:|No changes\.)' "$RUNNER_TEMP/plan.txt" | tail -1 || echo "Plan fallido")
          {
            echo "$marker"
            echo "### Terraform plan · workspace \`${TARGET_ENV}\`"
            echo "**${summary}**"
            echo
            echo "<details><summary>Plan completo</summary>"
            echo
            echo '```'
            tail -c 60000 "$RUNNER_TEMP/plan.txt"
            echo '```'
            echo "</details>"
          } > "$RUNNER_TEMP/comment.md"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
               --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)
          if [[ -n "$id" ]]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@"$RUNNER_TEMP/comment.md" >/dev/null
          else
            gh pr comment "$PR" --body-file "$RUNNER_TEMP/comment.md"
          fi
          echo "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Guardar el plan
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfplan-${{ github.base_ref }}-pr${{ github.event.pull_request.number }}
          path: ${{ runner.temp }}/plan.txt
          retention-days: 14
