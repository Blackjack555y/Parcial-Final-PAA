[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-common"
version = "0.2.0"
description = "Librería común de AegisVolt: configuración, logs JSON, correlación, DynamoDB, flags"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.44,<2",
]

[project.optional-dependencies]
# Solo los microservicios usan aegis_common.web (FastAPI). Los flujos de Prefect no: Prefect
# fija su propia versión de FastAPI y no deben chocar.
web = ["fastapi>=0.163,<1"]

[tool.setuptools]
packages = ["aegis_common"]
